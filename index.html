    function getStored(key, def) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : def;
      } catch (e) { return def; }

    // ==========================================
    // 3. SOUND SYNTHESIZER (NO EXTERNAL AUDIO FILES)
    // ==========================================
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.8);
      } catch (e) {}
    }

    // ==========================================
    // 4. CORE SCORING ALGORITHM
    // ==========================================
    function getAllRecipes() {
      return [...RECIPES, ...state.customRecipes];
    }

    function calculateRecipeScore(recipe) {
      let score = 0;
      // 1. Mode Match
      if (recipe.mode === state.mode) score += 30;
      // 2. Diet Match
      if (state.profile.diet === 'vegetarian') {
        if (recipe.dietType === 'vegetarian') score += 20;
        else score -= 50;
      } else if (state.profile.diet === 'eggetarian') {
        if (recipe.dietType === 'vegetarian' || recipe.dietType === 'eggetarian') score += 20;
        else score -= 40;
      } else {
        score += 20;
      }
      // 3. Time Match
      if (state.profile.maxTime > 0) {
        if (recipe.totalMinutes <= state.profile.maxTime) score += 15;
      } else {
        score += 10;
      }
      // 4. Protein preference
      if (state.profile.highProtein && recipe.nutrition.proteinG >= 25) score += 15;
      // 5. Pantry Match
      const reqNames = recipe.ingredients.map(i => i.name.toLowerCase());
      const hasCount = reqNames.filter(name => state.pantry.some(p => name.includes(p.toLowerCase()))).length;
      if (reqNames.length > 0) {
        score += Math.round((hasCount / reqNames.length) * 15);
      }
      // 6. Saved Bonus
      if (state.saved.includes(recipe.id)) score += 10;
      // 7. Rating Bonus
      if (state.ratings[recipe.id]?.stars >= 4) score += 10;
      return score;
    }

    function formatMeasurementDisplay(ing, scaledQty) {
      const mode = state.profile.measurement;
      const g = ing.grams ? Math.round(ing.grams * (scaledQty / ing.quantity)) : null;
      const metricStr = g ? `${g} g` : `${scaledQty} ${ing.unit}`;
      const practicalStr = ing.practicalMeasure || `${scaledQty} ${ing.unit}`;
      
      if (mode === 'metric') return metricStr;
      if (mode === 'household') return practicalStr;
      return `${metricStr} · ${practicalStr}`;
    }

    // ==========================================
    // 5. NAVIGATION & THEME CONTROLS
    // ==========================================
    function applyTheme() {
      document.body.className = `theme-${state.mode} min-h-screen pb-28 md:pb-12`;
      const dot = document.getElementById('header-mode-dot');
      const text = document.getElementById('header-mode-text');
      if (dot && text) {
        if (state.mode === 'healthy') {
          dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
          text.innerText = 'Healthy';
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-orange-400';
          text.innerText = 'Craving';
        }
      }
    }

    function toggleMode() {
      state.mode = state.mode === 'healthy' ? 'craving' : 'healthy';
      setStored('sass-sizzle-mode', state.mode);
      applyTheme();
      render();
    }

    function setExplicitMode(mode) {
      state.mode = mode;
      setStored('sass-sizzle-mode', mode);
      applyTheme();
      render();
    }

    function navigate(view, params = {}) {
      if (state.cookingTimerInterval) {
        clearInterval(state.cookingTimerInterval);
        state.cookingTimerInterval = null;
      }
      state.view = view;
      if (params.id) {
        state.activeRecipeId = params.id;
        const r = getAllRecipes().find(x => x.id === params.id);
        state.servings = r ? r.servings : 1;
        state.ingredientDeltas = {};
      }
      window.scrollTo(0, 0);
      render();
    }

    function toggleSave(id, e) {
      if (e) e.stopPropagation();
      if (state.saved.includes(id)) {
        state.saved = state.saved.filter(x => x !== id);
      } else {
        state.saved.push(id);
      }
      setStored('sass-sizzle-saved', state.saved);
      render();
    }

    // ==========================================
    // 6. VIEW RENDERERS
    // ==========================================
    function render() {
      const root = document.getElementById('app-root');
      applyTheme();
      updateBottomNav();

      if (state.view === 'home') root.innerHTML = getHomeHTML();
      else if (state.view === 'discover') root.innerHTML = getDiscoverHTML();
      else if (state.view === 'recipe') root.innerHTML = getRecipeHTML();
      else if (state.view === 'cooking') root.innerHTML = getCookingHTML();
      else if (state.view === 'pantry') root.innerHTML = getPantryHTML();
      else if (state.view === 'saved') root.innerHTML = getSavedHTML();
      else if (state.view === 'settings') root.innerHTML = getSettingsHTML();
      else if (state.view === 'create') root.innerHTML = getCreateRecipeHTML();

      lucide.createIcons();
    }

    function updateBottomNav() {
      ['home', 'discover', 'pantry', 'saved', 'settings'].forEach(nav => {
        const el = document.getElementById(`nav-btn-${nav}`);
        if (el) {
          if (state.view === nav) {
            el.className = 'flex flex-col items-center gap-1 accent-text opacity-100 font-bold scale-105 transition-transform';
          } else {
            el.className = 'flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition-opacity';
          }
        }
      });
    }

            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full glass-card text-xs font-semibold opacity-80">
              <span>👋 Hey ${state.profile.name || 'Chef'}.</span>
              <span class="opacity-40">•</span>
              <span>What are we making?</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight leading-tight">
              Fast food. <br />
              <span class="${accentColor}">${isHealthy ? 'Clean & Delicious.' : 'Pure Satisfaction.'}</span>
            </h1>
            <p class="text-lg opacity-75 max-w-lg leading-relaxed">
              Need dinner? Obviously. <br />
              Choose your vibe and let's make something stupidly easy.
            </p>

            <div class="flex flex-wrap gap-3 pt-2">
              <button onclick="setExplicitMode('healthy')" class="px-6 py-3.5 rounded-full font-bold text-sm transition-all shadow-lg flex items-center gap-2 ${isHealthy ? 'accent-bg scale-105' : 'glass-card opacity-70 hover:opacity-100'}">
                <i data-lucide="leaf" class="w-4 h-4"></i> I WANT HEALTHY
              </button>
              <button onclick="setExplicitMode('craving')" class="px-6 py-3.5 rounded-full font-bold text-sm transition-all shadow-lg flex items-center gap-2 ${!isHealthy ? 'accent-bg scale-105' : 'glass-card opacity-70 hover:opacity-100'}">
                <i data-lucide="flame" class="w-4 h-4"></i> I WANT CRAVING
              </button>
            </div>
          </section>

          <!-- TONIGHT'S PICKS -->
          <section class="space-y-4">
            <div class="flex items-end justify-between">
              <div>
                <p class="text-xs font-bold uppercase tracking-widest opacity-60 mb-1">
                  ${isHealthy ? "Let's keep it clean." : "Okay, we're treating ourselves."}
                </p>
                <h2 class="text-2xl font-bold">Tonight's Picks</h2>
              </div>
              <button onclick="navigate('discover')" class="text-xs font-bold opacity-70 hover:opacity-100 flex items-center gap-1">
                Browse all <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
              </button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
              ${picks.map(r => getRecipeCardHTML(r)).join('')}
            </div>
          </section>

          <!-- PANTRY TEASER -->
          <section class="glass-card-accent p-6 md:p-8 rounded-3xl flex flex-col md:flex-row items-center justify-between gap-6 shadow-xl">
            <div class="space-y-1.5 text-center md:text-left">
              <span class="text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-1 rounded-full bg-white/10 opacity-80 inline-block mb-1">Zero Grocery Runs</span>
              <h3 class="text-2xl font-bold">Cook with what you've got.</h3>
              <p class="text-sm opacity-75 max-w-md">Tell us what ingredients are lurking in your kitchen. We'll show you instant meals.</p>
            </div>
            <button onclick="navigate('pantry')" class="accent-bg px-8 py-4 rounded-full font-bold text-sm flex items-center gap-2.5 whitespace-nowrap shadow-xl hover:scale-105 transition-transform">
              <i data-lucide="refrigerator" class="w-4 h-4"></i> OPEN PANTRY (${state.pantry.length} items)
            </button>
          </section>

          <!-- SAVED SECTION -->
          <section class="space-y-4">
            <h2 class="text-2xl font-bold">Saved for Later</h2>
            ${savedList.length === 0 ? `
              <div class="glass-card p-8 rounded-3xl text-center space-y-2">
                <i data-lucide="heart" class="w-8 h-8 mx-auto opacity-30"></i>
                <p class="font-medium opacity-80">Nothing saved yet.</p>
                <p class="text-xs opacity-50">Find something you love, tap the heart, and keep it safe here.</p>
              </div>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                ${savedList.map(r => getRecipeCardHTML(r)).join('')}
              </div>
            `}
          </section>

          <!-- QUICK BITES -->
          <section class="space-y-4">
            <h2 class="text-2xl font-bold">⚡ In a Rush? (≤ 7 Mins)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${quickBites.map(r => getRecipeCardHTML(r, true)).join('')}
            </div>
          </section>
        </div>
      `;
    }

    // --- 6.2 RECIPE CARD COMPONENT ---
    function getRecipeCardHTML(recipe, compact = false) {
      const isSaved = state.saved.includes(recipe.id);
      const isHealthy = recipe.mode === 'healthy';
      const badgeColor = isHealthy ? 'text-emerald-400 bg-emerald-950/60 border-emerald-800/40' : 'text-orange-400 bg-orange-950/60 border-orange-800/40';

      return `
        <div onclick="navigate('recipe', { id: '${recipe.id}' })" class="group cursor-pointer glass-card rounded-3xl overflow-hidden border border-white/10 hover:border-white/25 transition-all duration-300 flex flex-col justify-between hover:-translate-y-1 shadow-lg">
          <div>
            <div class="aspect-[16/10] relative overflow-hidden bg-white/5">
              <img src="${recipe.image}" alt="${recipe.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" />
              <button onclick="toggleSave('${recipe.id}', event)" class="absolute top-3.5 right-3.5 p-2.5 rounded-full bg-black/60 backdrop-blur-md text-white border border-white/10 hover:scale-110 active:scale-95 transition-all">
                <i data-lucide="heart" class="w-4 h-4 ${isSaved ? 'fill-red-500 text-red-500' : ''}"></i>
              </button>
              <div class="absolute bottom-3 left-3 flex gap-2">
                <span class="text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-1 rounded-full border ${badgeColor}">
                  ${recipe.mode}
                </span>
                <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-black/70 backdrop-blur-md text-white/80">
                  ${recipe.totalMinutes} min
                </span>
              </div>
            </div>
            <div class="p-5 space-y-2">
              ${recipe.cheeky ? `<p class="text-[11px] font-bold accent-text tracking-wide">${recipe.cheeky}</p>` : ''}
              <h3 class="font-bold text-lg leading-snug group-hover:text-white">${recipe.title}</h3>
              <p class="text-xs opacity-65 line-clamp-2 leading-relaxed">${recipe.description}</p>
            </div>
          </div>
          <div class="px-5 pb-5 pt-2 flex items-center justify-between text-xs font-semibold opacity-70 border-t border-white/5">
            <span>${recipe.nutrition.calories} kcal</span>
            <span>${recipe.nutrition.proteinG}g protein</span>
            <span class="capitalize">${recipe.equipment[0] || '1 Pan'}</span>
          </div>
        </div>
      `;
    }

    // --- 6.3 DISCOVER VIEW (INSTANT SEARCH & FILTER) ---
    function getDiscoverHTML() {
      let results = getAllRecipes();

      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        results = results.filter(r => 
          r.title.toLowerCase().includes(q) ||
          r.description.toLowerCase().includes(q) ||
          r.ingredients.some(i => i.name.toLowerCase().includes(q)) ||
          r.equipment.some(e => e.toLowerCase().includes(q))
        );
      }

      if (state.filterMood !== 'all') results = results.filter(r => r.mode === state.filterMood);
      if (state.filterDiet !== 'all') results = results.filter(r => r.dietType === state.filterDiet);
      if (state.filterTime > 0) results = results.filter(r => r.totalMinutes <= state.filterTime);
      if (state.filterProtein) results = results.filter(r => r.nutrition.proteinG >= 25);

      if (state.sortBy === 'fastest') results.sort((a, b) => a.totalMinutes - b.totalMinutes);
      else if (state.sortBy === 'protein') results.sort((a, b) => b.nutrition.proteinG - a.nutrition.proteinG);
      else if (state.sortBy === 'calories') results.sort((a, b) => a.nutrition.calories - b.nutrition.calories);
      else if (state.sortBy === 'recommended') results.sort((a, b) => calculateRecipeScore(b) - calculateRecipeScore(a));

      return `
        <div class="space-y-6 animate-in fade-in pb-12">
          <div>
            <h1 class="text-3xl font-extrabold mb-1">Find your next meal.</h1>
            <p class="text-xs opacity-60">Instant live search across titles, ingredients, and pantry staples.</p>
          </div>

          <!-- SEARCH INPUT -->
          <div class="relative">
            <i data-lucide="search" class="w-5 h-5 absolute left-4 top-3.5 opacity-40"></i>
            <input 
              type="text" 
              placeholder="Search recipes, ingredients, eggs, noodles..." 
              value="${state.searchQuery}" 
              oninput="handleSearch(this.value)"
              class="w-full bg-white/5 border border-white/10 rounded-2xl pl-12 pr-4 py-3.5 text-sm focus:outline-none focus:border-emerald-400 glass-card"
            />
          </div>

          <!-- ACTIVE FILTER CHIPS -->
          <div class="flex flex-wrap gap-2 items-center text-xs">
            <select onchange="handleFilter('filterMood', this.value)" class="bg-[#201E1C] border border-white/10 rounded-xl px-3 py-2">
              <option value="all" ${state.filterMood === 'all' ? 'selected' : ''}>All Vibes</option>
              <option value="healthy" ${state.filterMood === 'healthy' ? 'selected' : ''}>Healthy</option>
              <option value="craving" ${state.filterMood === 'craving' ? 'selected' : ''}>Craving</option>
            </select>

            <select onchange="handleFilter('filterDiet', this.value)" class="bg-[#201E1C] border border-white/10 rounded-xl px-3 py-2">
              <option value="all" ${state.filterDiet === 'all' ? 'selected' : ''}>All Diets</option>
              <option value="vegetarian" ${state.filterDiet === 'vegetarian' ? 'selected' : ''}>Vegetarian</option>
              <option value="eggetarian" ${state.filterDiet === 'eggetarian' ? 'selected' : ''}>Eggetarian</option>
              <option value="non_vegetarian" ${state.filterDiet === 'non_vegetarian' ? 'selected' : ''}>Non-Vegetarian</option>
            </select>

            <select onchange="handleFilter('filterTime', Number(this.value))" class="bg-[#201E1C] border border-white/10 rounded-xl px-3 py-2">
              <option value="0" ${state.filterTime === 0 ? 'selected' : ''}>Any Time</option>
              <option value="5" ${state.filterTime === 5 ? 'selected' : ''}>≤ 5 min</option>
              <option value="10" ${state.filterTime === 10 ? 'selected' : ''}>≤ 10 min</option>
              <option value="15" ${state.filterTime === 15 ? 'selected' : ''}>≤ 15 min</option>
            </select>

            <button onclick="handleFilter('filterProtein', !state.filterProtein)" class="px-3 py-2 rounded-xl border text-xs font-semibold ${state.filterProtein ? 'accent-bg' : 'glass-card border-white/10'}">
              High Protein (≥25g)
            </button>

            <select onchange="handleFilter('sortBy', this.value)" class="bg-[#201E1C] border border-white/10 rounded-xl px-3 py-2 ml-auto">
              <option value="recommended" ${state.sortBy === 'recommended' ? 'selected' : ''}>Sort: Best Match</option>
              <option value="fastest" ${state.sortBy === 'fastest' ? 'selected' : ''}>Sort: Fastest</option>
              <option value="protein" ${state.sortBy === 'protein' ? 'selected' : ''}>Sort: High Protein</option>
              <option value="calories" ${state.sortBy === 'calories' ? 'selected' : ''}>Sort: Low Calorie</option>
            </select>
          </div>

          <!-- RESULTS -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5 pt-2">
            ${results.length === 0 ? `
              <div class="col-span-full text-center py-16 glass-card rounded-3xl space-y-3">
                <i data-lucide="chef-hat" class="w-10 h-10 mx-auto opacity-30"></i>
                <p class="text-lg font-bold">Nothing found.</p>
                <p class="text-xs opacity-60">Try searching for a different ingredient or clearing filters.</p>
                <button onclick="clearFilters()" class="accent-bg px-5 py-2.5 rounded-full text-xs font-bold">Reset Filters</button>
              </div>
            ` : results.map(r => getRecipeCardHTML(r)).join('')}
          </div>
        </div>
      `;
    }

    function handleSearch(val) { state.searchQuery = val; render(); }
    function handleFilter(key, val) { state[key] = val; render(); }
    function clearFilters() {
      state.searchQuery = ''; state.filterMood = 'all'; state.filterDiet = 'all';
      state.filterTime = 0; state.filterProtein = false; state.sortBy = 'recommended';
      render();
    }

    // --- 6.4 RECIPE DETAIL VIEW (DYNAMIC ADJUSTER & NUTRITION) ---
    function getRecipeHTML() {
      const recipe = getAllRecipes().find(r => r.id === state.activeRecipeId);
      if (!recipe) return `<div class="text-center py-20"><p>That recipe wandered off.</p><button onclick="navigate('discover')" class="mt-4 accent-bg px-6 py-2 rounded-full">Back to Discover</button></div>`;

      const baseServings = recipe.servings || 1;
      const scale = state.servings / baseServings;
      const isSaved = state.saved.includes(recipe.id);
      const userRating = state.ratings[recipe.id] || { stars: 0, wouldMakeAgain: null };

      // Calculate dynamically scaled ingredients
      const currentIngredients = recipe.ingredients.map(ing => {
        const delta = state.ingredientDeltas[ing.id] !== undefined ? state.ingredientDeltas[ing.id] : (ing.quantity * scale);
        return {
          ...ing,
          currentQty: Math.max(0.25, Number(delta.toFixed(2)))
        };
      });

      // Calculate total nutrition scaled to current custom ingredient ratio
      let totalCalories = 0, totalProtein = 0, totalCarbs = 0, totalFiber = 0, totalFat = 0;
      let ratioSum = 0;
      currentIngredients.forEach(i => {
        ratioSum += (i.currentQty / i.quantity);
      });
      const avgRatio = ratioSum / currentIngredients.length;

      totalCalories = Math.round(recipe.nutrition.calories * avgRatio);
      totalProtein = Math.round(recipe.nutrition.proteinG * avgRatio);
      totalCarbs = Math.round(recipe.nutrition.carbsG * avgRatio);
      totalFiber = Math.round(recipe.nutrition.fiberG * avgRatio);
      totalFat = Math.round(recipe.nutrition.fatG * avgRatio);
      const netCarbs = Math.max(0, totalCarbs - totalFiber);

      return `
        <div class="max-w-3xl mx-auto space-y-8 animate-in fade-in pb-20">
          <button onclick="navigate('home')" class="inline-flex items-center gap-2 text-xs font-bold opacity-60 hover:opacity-100">
            <i data-lucide="chevron-left" class="w-4 h-4"></i> Back
          </button>

          <!-- HERO IMAGE -->
          <div class="aspect-[16/9] rounded-3xl overflow-hidden relative glass-card">
            <img src="${recipe.image}" alt="${recipe.title}" class="w-full h-full object-cover" />
            <button onclick="toggleSave('${recipe.id}', event)" class="absolute top-4 right-4 p-3 rounded-full bg-black/60 backdrop-blur-md text-white border border-white/10 hover:scale-110 active:scale-95 transition-all">
              <i data-lucide="heart" class="w-5 h-5 ${isSaved ? 'fill-red-500 text-red-500' : ''}"></i>
            </button>
          </div>

          <!-- META -->
          <div class="space-y-3">
            <div class="flex items-center gap-2">
              <span class="text-xs font-extrabold uppercase tracking-widest px-3 py-1 rounded-full accent-bg text-black">
                ${recipe.mode}
              </span>
              <span class="text-xs font-bold uppercase tracking-wider opacity-60">
                ${recipe.dietType.replace('_', ' ')}
              </span>
            </div>
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">${recipe.title}</h1>
            <p class="text-sm md:text-base opacity-75 leading-relaxed">${recipe.description}</p>
            
            <div class="flex flex-wrap gap-4 py-3 border-y border-white/10 text-xs font-semibold opacity-80">
              <div class="flex items-center gap-1.5"><i data-lucide="clock" class="w-4 h-4 accent-text"></i> ${recipe.totalMinutes} mins total (${recipe.activePrepMinutes}m prep / ${recipe.cookMinutes}m cook)</div>
              <div class="flex items-center gap-1.5"><i data-lucide="utensils" class="w-4 h-4 accent-text"></i> ${recipe.equipment.join(', ')}</div>
            </div>
          </div>

          <!-- SERVINGS ADJUSTER -->
          <section class="glass-card p-5 rounded-3xl flex items-center justify-between">
            <div>
              <h3 class="font-bold text-sm">Servings</h3>
              <p class="text-xs opacity-50">Ingredients scale automatically</p>
            </div>
            <div class="flex items-center gap-3 bg-white/5 border border-white/10 rounded-full p-1">
              <button onclick="adjustServings(-1)" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 font-bold">-</button>
              <span class="w-6 text-center font-extrabold text-sm">${state.servings}</span>
              <button onclick="adjustServings(1)" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 font-bold">+</button>
            </div>
          </section>

          <!-- INGREDIENTS WITH INDIVIDUAL ADJUSTERS -->
          <section class="space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-xl font-bold">Ingredients</h2>
              <span class="text-xs opacity-50 font-medium">Tap - / + to customize</span>
            </div>
            <div class="space-y-2.5">
              ${currentIngredients.map(ing => `
                <div class="glass-card p-3.5 rounded-2xl flex items-center justify-between border border-white/5">
                  <div class="flex items-center gap-3">
                    <div class="flex items-center gap-1.5 bg-black/40 rounded-full p-1 border border-white/10">
                      <button onclick="adjustIngredientQty('${ing.id}', -0.25)" class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-xs hover:bg-white/20">-</button>
                      <span class="w-8 text-center text-xs font-bold">${ing.currentQty}</span>
                      <button onclick="adjustIngredientQty('${ing.id}', 0.25)" class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-xs hover:bg-white/20">+</button>
                    </div>
                    <span class="font-semibold text-sm">${ing.name}</span>
                  </div>
                  <span class="text-xs opacity-65 text-right font-medium">
                    ${formatMeasurementDisplay(ing, ing.currentQty)}
                  </span>
                </div>
              `).join('')}
            </div>
          </section>

          <!-- DYNAMIC NUTRITION PANEL -->
          <section class="space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-xl font-bold">Prototype Nutrition</h2>
              <span class="text-[10px] opacity-40 uppercase tracking-widest font-bold">Estimates only</span>
            </div>
            <div class="grid grid-cols-3 md:grid-cols-6 gap-2.5">
              <div class="glass-card p-3 rounded-2xl text-center">
                <div class="text-xl font-black accent-text">${totalCalories}</div>
                <div class="text-[10px] font-bold opacity-60 uppercase tracking-wider">Calories</div>
              </div>
              <div class="glass-card p-3 rounded-2xl text-center">
                <div class="text-xl font-black text-emerald-400">${totalProtein}g</div>
                <div class="text-[10px] font-bold opacity-60 uppercase tracking-wider">Protein</div>
              </div>
              <div class="glass-card p-3 rounded-2xl text-center">
                <div class="text-xl font-black">${totalCarbs}g</div>
                <div class="text-[10px] font-bold opacity-60 uppercase tracking-wider">Carbs</div>
              </div>
              <div class="glass-card p-3 rounded-2xl text-center">
                <div class="text-xl font-black">${totalFiber}g</div>
                <div class="text-[10px] font-bold opacity-60 uppercase tracking-wider">Fiber</div>
              </div>
              <div class="glass-card p-3 rounded-2xl text-center">
                <div class="text-xl font-black">${netCarbs}g</div>
                <div class="text-[10px] font-bold opacity-60 uppercase tracking-wider">Net Carbs</div>
              </div>
              <div class="glass-card p-3 rounded-2xl text-center">
                <div class="text-xl font-black">${totalFat}g</div>
                <div class="text-[10px] font-bold opacity-60 uppercase tracking-wider">Fat</div>
              </div>
            </div>
          </section>

          <!-- MICRONUTRIENTS -->
          ${recipe.micronutrients && recipe.micronutrients.length > 0 ? `
            <section class="space-y-3">
              <h2 class="text-xl font-bold">Key Micronutrients</h2>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                ${recipe.micronutrients.map(m => `
                  <div class="glass-card p-4 rounded-2xl space-y-1">
                    <div class="flex justify-between items-center">
                      <span class="font-bold text-sm">${m.nutrient}</span>
                      <span class="text-xs font-bold accent-text">${m.amount} ${m.unit}</span>
                    </div>
                    <p class="text-xs opacity-65 leading-relaxed">${m.benefit}</p>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

          <!-- PERSONAL NOTES & RATINGS -->
          <section class="glass-card p-6 rounded-3xl space-y-4">
            <h2 class="text-xl font-bold">Personal Notes & Rating</h2>
            <textarea 
              oninput="handleSaveNotes('${recipe.id}', this.value)"
              placeholder="What would you tweak next time? (e.g. add extra chili, double paneer...)"
              class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-sm focus:outline-none focus:border-emerald-400 min-h-[90px]"
            >${state.notes[recipe.id] || ''}</textarea>

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pt-2 border-t border-white/5">
              <div class="flex items-center gap-1.5">
                <span class="text-xs font-bold opacity-60 mr-2">Rate:</span>
                ${[1,2,3,4,5].map(star => `
                  <button onclick="handleRating('${recipe.id}', ${star})" class="p-1 hover:scale-125 transition-transform text-amber-400">
                    <i data-lucide="star" class="w-5 h-5 ${star <= userRating.stars ? 'fill-amber-400' : 'opacity-30'}"></i>
                  </button>
                `).join('')}
              </div>

              <div class="flex items-center gap-2">
                <span class="text-xs font-bold opacity-60">Make again?</span>
                <button onclick="handleWouldMakeAgain('${recipe.id}', 'YES')" class="px-3 py-1.5 rounded-lg text-xs font-bold border ${userRating.wouldMakeAgain === 'YES' ? 'accent-bg' : 'border-white/10'}">YES</button>
                <button onclick="handleWouldMakeAgain('${recipe.id}', 'MAYBE')" class="px-3 py-1.5 rounded-lg text-xs font-bold border ${userRating.wouldMakeAgain === 'MAYBE' ? 'accent-bg' : 'border-white/10'}">MAYBE</button>
                <button onclick="handleWouldMakeAgain('${recipe.id}', 'NO')" class="px-3 py-1.5 rounded-lg text-xs font-bold border ${userRating.wouldMakeAgain === 'NO' ? 'accent-bg' : 'border-white/10'}">NO</button>
              </div>
            </div>
          </section>

          <!-- STICKY COOKING BAR -->
          <div class="sticky bottom-24 md:bottom-8 z-30 flex justify-center">
            <button onclick="startCooking('${recipe.id}')" class="accent-bg px-10 py-5 rounded-full font-black text-base flex items-center gap-3 shadow-2xl hover:scale-105 active:scale-95 transition-all">
              <i data-lucide="play" class="w-5 h-5 fill-current"></i> START COOKING MODE
            </button>
          </div>
        </div>
      `;
    }

    function adjustServings(delta) {
      const next = state.servings + delta;
      if (next >= 1 && next <= 6) {
        state.servings = next;
        state.ingredientDeltas = {};
        render();
      }
    }

    function adjustIngredientQty(ingId, delta) {
      const recipe = getAllRecipes().find(r => r.id === state.activeRecipeId);
      const ing = recipe.ingredients.find(i => i.id === ingId);
      const cur = state.ingredientDeltas[ingId] !== undefined ? state.ingredientDeltas[ingId] : (ing.quantity * (state.servings / recipe.servings));
      const next = Math.max(0.25, cur + delta);
      state.ingredientDeltas[ingId] = next;
      render();
    }

    function handleSaveNotes(id, text) {
      state.notes[id] = text;
      setStored('sass-sizzle-notes', state.notes);
    }

    function handleRating(id, stars) {
      if (!state.ratings[id]) state.ratings[id] = {};
      state.ratings[id].stars = stars;
      setStored('sass-sizzle-ratings', state.ratings);
      render();
    }

    function handleWouldMakeAgain(id, choice) {
      if (!state.ratings[id]) state.ratings[id] = {};
      state.ratings[id].wouldMakeAgain = choice;
      setStored('sass-sizzle-ratings', state.ratings);
      render();
    }

    // --- 6.5 COOKING MODE VIEW (TIMESTAMP-BASED TIMER) ---
    function startCooking(id) {
      state.activeRecipeId = id;
      state.cookingStep = 0;
      const recipe = getAllRecipes().find(r => r.id === id);
      const firstStepTimer = recipe.steps[0]?.timerSeconds || 0;
      state.cookingTimerRemaining = firstStepTimer;
      state.cookingTimerRunning = false;
      state.cookingTimerEnd = null;
      navigate('cooking');
    }

    function getCookingHTML() {
      const recipe = getAllRecipes().find(r => r.id === state.activeRecipeId);
      if (!recipe) return '';

      const totalSteps = recipe.steps.length;
      const step = recipe.steps[state.cookingStep];
      const isCompleted = state.cookingStep >= totalSteps;

      if (isCompleted) {
        return `
          <div class="max-w-md mx-auto text-center py-16 space-y-6 animate-in fade-in">
            <div class="w-20 h-20 rounded-3xl accent-bg flex items-center justify-center mx-auto shadow-2xl">
              <i data-lucide="check" class="w-10 h-10 text-stone-900"></i>
            </div>
            <div class="space-y-2">
              <h1 class="text-4xl font-extrabold">You did it.</h1>
              <p class="text-xl accent-text font-bold">Dinner: handled.</p>
              <p class="text-sm opacity-65">Look at you, cooking like an absolute boss.</p>
            </div>
            <div class="space-y-3 pt-6">
              <button onclick="navigate('recipe', { id: '${recipe.id}' })" class="w-full py-4 rounded-full accent-bg font-bold text-sm">Rate & View Recipe</button>
              <button onclick="navigate('home')" class="w-full py-4 rounded-full glass-card font-bold text-sm opacity-80 hover:opacity-100">Back to Kitchen</button>
            </div>
          </div>
        `;
      }

      const mins = Math.floor(state.cookingTimerRemaining / 60).toString().padStart(2, '0');
      const secs = (state.cookingTimerRemaining % 60).toString().padStart(2, '0');

      return `
        <div class="max-w-2xl mx-auto min-h-[80vh] flex flex-col justify-between py-6 animate-in fade-in">
          <!-- TOP BAR -->
          <div class="flex items-center justify-between border-b border-white/10 pb-4">
            <button onclick="navigate('recipe', { id: '${recipe.id}' })" class="text-xs font-bold opacity-60 hover:opacity-100 flex items-center gap-1">
              <i data-lucide="x" class="w-4 h-4"></i> Exit
            </button>
            <div class="flex items-center gap-1.5">
              ${recipe.steps.map((_, i) => `
                <div class="w-2.5 h-2.5 rounded-full ${i === state.cookingStep ? 'accent-bg' : i < state.cookingStep ? 'bg-white/80' : 'bg-white/20'}"></div>
              `).join('')}
            </div>
            <span class="text-xs font-extrabold uppercase tracking-widest opacity-60">Step ${state.cookingStep + 1} / ${totalSteps}</span>
          </div>

          <!-- STEP INSTRUCTION -->
          <div class="text-center py-8 space-y-8">
            <h2 class="text-3xl md:text-5xl font-extrabold leading-tight tracking-tight max-w-xl mx-auto">
              ${step.instruction}
            </h2>

            <!-- REAL TIMER -->
            ${step.timerSeconds > 0 ? `
              <div class="glass-card p-8 rounded-3xl max-w-xs mx-auto space-y-4 border border-white/15 shadow-2xl">
                <div class="text-6xl font-black tracking-tighter font-mono ${state.cookingTimerRemaining === 0 ? 'text-emerald-400 animate-pulse' : ''}">
                  ${mins}:${secs}
                </div>
                <div class="flex justify-center gap-3">
                  <button onclick="toggleCookingTimer()" class="w-14 h-14 rounded-full accent-bg flex items-center justify-center hover:scale-105 active:scale-95 transition-transform shadow-lg">
                    <i data-lucide="${state.cookingTimerRunning ? 'pause' : 'play'}" class="w-6 h-6 fill-current"></i>
                  </button>
                  <button onclick="resetCookingTimer(${step.timerSeconds})" class="w-14 h-14 rounded-full glass-card flex items-center justify-center hover:bg-white/20 transition-all">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                  </button>
                </div>
              </div>
            ` : ''}
          </div>

          <!-- BOTTOM CONTROLS -->
          <div class="flex items-center justify-between pt-6 border-t border-white/10">
            <button onclick="prevCookingStep()" class="px-6 py-4 rounded-full glass-card text-xs font-bold ${state.cookingStep === 0 ? 'opacity-30 pointer-events-none' : 'hover:bg-white/20'} flex items-center gap-2">
              <i data-lucide="chevron-left" class="w-4 h-4"></i> Previous
            </button>
            <button onclick="nextCookingStep()" class="px-8 py-4 rounded-full accent-bg text-sm font-black flex items-center gap-2 shadow-xl hover:scale-105 transition-transform">
              ${state.cookingStep === totalSteps - 1 ? 'Finish!' : 'Next Step'} <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `;
    }

    function toggleCookingTimer() {
      if (state.cookingTimerRunning) {
        // PAUSE
        clearInterval(state.cookingTimerInterval);
        state.cookingTimerInterval = null;
        state.cookingTimerRunning = false;
      } else {
        // START/RESUME (Timestamp-based)
        state.cookingTimerRunning = true;
        state.cookingTimerEnd = Date.now() + (state.cookingTimerRemaining * 1000);
        state.cookingTimerInterval = setInterval(() => {
          const rem = Math.max(0, Math.ceil((state.cookingTimerEnd - Date.now()) / 1000));
          state.cookingTimerRemaining = rem;
          if (rem === 0) {
            clearInterval(state.cookingTimerInterval);
            state.cookingTimerInterval = null;
            state.cookingTimerRunning = false;
            playBeep();
          }
          render();
        }, 500);
      }
      render();
    }

    function resetCookingTimer(sec) {
      if (state.cookingTimerInterval) clearInterval(state.cookingTimerInterval);
      state.cookingTimerInterval = null;
      state.cookingTimerRunning = false;
      state.cookingTimerRemaining = sec;
      render();
    }

    function nextCookingStep() {
      const recipe = getAllRecipes().find(r => r.id === state.activeRecipeId);
      if (state.cookingTimerInterval) clearInterval(state.cookingTimerInterval);
      state.cookingTimerInterval = null;
      state.cookingTimerRunning = false;

      if (state.cookingStep < recipe.steps.length - 1) {
        state.cookingStep++;
        const nextSec = recipe.steps[state.cookingStep]?.timerSeconds || 0;
        state.cookingTimerRemaining = nextSec;
      } else {
        // COMPLETE
        state.cookingStep++;
        state.history.push({
          recipeId: recipe.id,
          completedAt: new Date().toISOString(),
          servings: state.servings
        });
        setStored('sass-sizzle-history', state.history);
      }
      render();
    }

    function prevCookingStep() {
      if (state.cookingStep > 0) {
        if (state.cookingTimerInterval) clearInterval(state.cookingTimerInterval);
        state.cookingTimerInterval = null;
        state.cookingTimerRunning = false;
        state.cookingStep--;
        const recipe = getAllRecipes().find(r => r.id === state.activeRecipeId);
        state.cookingTimerRemaining = recipe.steps[state.cookingStep]?.timerSeconds || 0;
        render();
      }
    }

    // --- 6.6 PANTRY VIEW ---
    function getPantryHTML() {
      const recipes = getAllRecipes();
      const matchResults = recipes.map(recipe => {
        const reqNames = recipe.ingredients.map(i => i.name.toLowerCase());
        const matched = reqNames.filter(req => state.pantry.some(p => req.includes(p.toLowerCase())));
        const score = reqNames.length ? Math.round((matched.length / reqNames.length) * 100) : 0;
        const missing = recipe.ingredients.filter(i => !state.pantry.some(p => i.name.toLowerCase().includes(p.toLowerCase())));
        return { recipe, score, missing };
      }).sort((a, b) => b.score - a.score);

      return `
        <div class="space-y-8 animate-in fade-in pb-16">
          <div>
            <h1 class="text-3xl md:text-4xl font-extrabold mb-1">What's lurking in your kitchen?</h1>
            <p class="text-xs md:text-sm opacity-65">Tell us what you've got. We'll tell you what you can make.</p>
          </div>

          <!-- SELECTOR -->
          <section class="glass-card p-6 rounded-3xl space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold uppercase tracking-widest opacity-60">Tap to Toggle Pantry Items</h3>
              <div class="flex gap-2">
                <button onclick="toggleAllPantry(true)" class="text-xs font-bold opacity-60 hover:opacity-100">Select Common</button>
                <span class="opacity-30">•</span>
                <button onclick="toggleAllPantry(false)" class="text-xs font-bold text-red-400 opacity-60 hover:opacity-100">Clear</button>
              </div>
            </div>

            <div class="flex flex-wrap gap-2">
              ${PANTRY_STAPLES.map(item => {
                const has = state.pantry.includes(item);
                return `
                  <button onclick="togglePantryItem('${item}')" class="px-3.5 py-2 rounded-full text-xs font-bold transition-all flex items-center gap-1.5 ${has ? 'accent-bg shadow-md' : 'glass-card border-white/10 opacity-70 hover:opacity-100'}">
                    <i data-lucide="${has ? 'check' : 'plus'}" class="w-3.5 h-3.5"></i> ${item}
                  </button>
                `;
              }).join('')}
            </div>
          </section>

          <!-- MATCHING RESULTS -->
          <section class="space-y-4">
            <h2 class="text-2xl font-bold">What You Can Make (${matchResults.filter(x => x.score > 0).length})</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${matchResults.map(({ recipe, score, missing }) => `
                <div onclick="navigate('recipe', { id: '${recipe.id}' })" class="glass-card p-5 rounded-3xl cursor-pointer hover:border-white/30 transition-all flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-start mb-2">
                      <h4 class="text-lg font-bold">${recipe.title}</h4>
                      <span class="text-xs font-black px-2.5 py-1 rounded-full ${score === 100 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-white/10 text-white/80'}">
                        ${score}% MATCH
                      </span>
                    </div>
                    ${score === 100 ? `
                      <p class="text-xs font-bold text-emerald-400 flex items-center gap-1">
                        <i data-lucide="check-circle" class="w-3.5 h-3.5"></i> You've got everything!
                      </p>
                    ` : `
                      <p class="text-xs opacity-60">
                        Missing: <span class="text-white/90 font-medium">${missing.map(m => m.name).slice(0, 3).join(', ')}${missing.length > 3 ? '...' : ''}</span>
                      </p>
                    `}
                  </div>
                  <div class="flex items-center justify-between text-xs opacity-50 mt-4 pt-3 border-t border-white/5">
                    <span>${recipe.totalMinutes} min</span>
                    <span>${recipe.nutrition.calories} kcal</span>
                    <span>${recipe.nutrition.proteinG}g protein</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function togglePantryItem(name) {
      if (state.pantry.includes(name)) {
        state.pantry = state.pantry.filter(x => x !== name);
      } else {
        state.pantry.push(name);
      }
      setStored('sass-sizzle-pantry', state.pantry);
      render();
    }

    function toggleAllPantry(selectCommon) {
      if (selectCommon) {
        state.pantry = ["Eggs", "Cooked rice", "Cooking oil", "Soy sauce", "Black pepper", "Spring onion", "Paneer", "Whole-grain bread"];
      } else {
        state.pantry = [];
      }
      setStored('sass-sizzle-pantry', state.pantry);
      render();
    }

    // --- 6.7 SAVED RECIPES VIEW ---
    function getSavedHTML() {
      const savedList = getAllRecipes().filter(r => state.saved.includes(r.id));
      return `
        <div class="space-y-6 animate-in fade-in pb-16">
          <div>
            <h1 class="text-3xl font-extrabold mb-1">Your Recipe Vault</h1>
            <p class="text-xs opacity-60">${savedList.length} recipes saved for quick access</p>
          </div>

          ${savedList.length === 0 ? `
            <div class="glass-card p-12 rounded-3xl text-center space-y-3">
              <i data-lucide="heart" class="w-12 h-12 mx-auto opacity-20"></i>
              <h3 class="text-lg font-bold">Nothing saved yet.</h3>
              <p class="text-xs opacity-60">Go find something dangerously delicious and hit the heart.</p>
              <button onclick="navigate('discover')" class="accent-bg px-6 py-2.5 rounded-full text-xs font-bold mt-2">Explore Recipes</button>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
              ${savedList.map(r => getRecipeCardHTML(r)).join('')}
            </div>
          `}
        </div>
      `;
    }

    // --- 6.8 SETTINGS & PROFILE VIEW (BACKUP / RESTORE) ---
    function getSettingsHTML() {
      return `
        <div class="max-w-2xl mx-auto space-y-8 animate-in fade-in pb-20">
          <div>
            <h1 class="text-3xl font-extrabold mb-1">Personal Settings</h1>
            <p class="text-xs opacity-60">Stored 100% locally in your browser. Zero backend.</p>
          </div>

          <!-- PROFILE FORM -->
          <section class="glass-card p-6 rounded-3xl space-y-5">
            <h2 class="text-lg font-bold border-b border-white/10 pb-3">Your Preferences</h2>
            
            <div class="space-y-4 text-sm">
              <div>
                <label class="text-xs font-bold uppercase tracking-wider opacity-60 block mb-1.5">What should we call you?</label>
                <input 
                  type="text" 
                  value="${state.profile.name || ''}" 
                  oninput="updateProfile('name', this.value)"
                  class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-400"
                />
              </div>

              <div>
                <label class="text-xs font-bold uppercase tracking-wider opacity-60 block mb-1.5">Dietary Filter</label>
                <select onchange="updateProfile('diet', this.value)" class="w-full bg-[#201E1C] border border-white/10 rounded-xl px-3 py-2.5">
                  <option value="vegetarian" ${state.profile.diet === 'vegetarian' ? 'selected' : ''}>Vegetarian</option>
                  <option value="eggetarian" ${state.profile.diet === 'eggetarian' ? 'selected' : ''}>Eggetarian</option>
                  <option value="non_vegetarian" ${state.profile.diet === 'non_vegetarian' ? 'selected' : ''}>Non-Vegetarian</option>
                </select>
              </div>

              <div>
                <label class="text-xs font-bold uppercase tracking-wider opacity-60 block mb-1.5">Preferred Maximum Cooking Time</label>
                <select onchange="updateProfile('maxTime', Number(this.value))" class="w-full bg-[#201E1C] border border-white/10 rounded-xl px-3 py-2.5">
                  <option value="0" ${state.profile.maxTime === 0 ? 'selected' : ''}>No Limit</option>
                  <option value="5" ${state.profile.maxTime === 5 ? 'selected' : ''}>5 minutes</option>
                  <option value="10" ${state.profile.maxTime === 10 ? 'selected' : ''}>10 minutes</option>
                  <option value="15" ${state.profile.maxTime === 15 ? 'selected' : ''}>15 minutes</option>
                </select>
              </div>

              <div>
                <label class="text-xs font-bold uppercase tracking-wider opacity-60 block mb-1.5">Measurement Format</label>
                <select onchange="updateProfile('measurement', this.value)" class="w-full bg-[#201E1C] border border-white/10 rounded-xl px-3 py-2.5">
                  <option value="both" ${state.profile.measurement === 'both' ? 'selected' : ''}>Both (150 g · about 1 cup)</option>
                  <option value="metric" ${state.profile.measurement === 'metric' ? 'selected' : ''}>Metric Only (150 g)</option>
                  <option value="household" ${state.profile.measurement === 'household' ? 'selected' : ''}>Household Only (about 1 cup)</option>
                </select>
              </div>
            </div>
          </section>

          <!-- COOKING STATS -->
          <section class="glass-card p-6 rounded-3xl space-y-2">
            <h2 class="text-lg font-bold">Your Cooking History</h2>
            <p class="text-sm opacity-70">You have completed <strong class="accent-text text-base">${state.history.length}</strong> home-cooked meals.</p>
          </section>

          <!-- DATA BACKUP & RESTORE -->
          <section class="glass-card p-6 rounded-3xl space-y-4">
            <h2 class="text-lg font-bold border-b border-white/10 pb-3">Data Portability</h2>
            <div class="flex flex-wrap gap-3">
              <button onclick="exportJSONBackup()" class="px-5 py-2.5 rounded-full accent-bg text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="download" class="w-4 h-4"></i> Export My Data (JSON)
              </button>
              <label class="px-5 py-2.5 rounded-full glass-card border border-white/10 text-xs font-bold flex items-center gap-1.5 cursor-pointer hover:bg-white/10">
                <i data-lucide="upload" class="w-4 h-4"></i> Import Data
                <input type="file" accept=".json" onchange="importJSONBackup(event)" class="hidden" />
              </label>
            </div>
          </section>

          <!-- DANGER ZONE -->
          <section class="p-6 rounded-3xl border border-red-500/20 bg-red-950/10 space-y-3">
            <h2 class="text-sm font-bold text-red-400 uppercase tracking-widest">Danger Zone</h2>
            <p class="text-xs opacity-65">This will clear your local saved recipes, pantry list, custom recipes, notes, and cooking history.</p>
            <button onclick="resetEverything()" class="px-5 py-2.5 rounded-full bg-red-500/20 text-red-300 border border-red-500/40 text-xs font-bold hover:bg-red-500/40">
              Reset Everything
            </button>
          </section>
        </div>
      `;
    }

    function updateProfile(key, val) {
      state.profile[key] = val;
      setStored('sass-sizzle-profile', state.profile);
    }

    function exportJSONBackup() {
      const data = {
        profile: state.profile,
        mode: state.mode,
        pantry: state.pantry,
        saved: state.saved,
        notes: state.notes,
        ratings: state.ratings,
        history: state.history,
        customRecipes: state.customRecipes
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sass-and-sizzle-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function importJSONBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed && typeof parsed === 'object') {
            if (parsed.profile) setStored('sass-sizzle-profile', state.profile = parsed.profile);
            if (parsed.mode) setStored('sass-sizzle-mode', state.mode = parsed.mode);
            if (parsed.pantry) setStored('sass-sizzle-pantry', state.pantry = parsed.pantry);
            if (parsed.saved) setStored('sass-sizzle-saved', state.saved = parsed.saved);
            if (parsed.notes) setStored('sass-sizzle-notes', state.notes = parsed.notes);
            if (parsed.ratings) setStored('sass-sizzle-ratings', state.ratings = parsed.ratings);
            if (parsed.history) setStored('sass-sizzle-history', state.history = parsed.history);
            if (parsed.customRecipes) setStored('sass-sizzle-custom-recipes', state.customRecipes = parsed.customRecipes);
            alert('Backup restored successfully!');
            render();
          } else {
            alert("That file doesn't look like a Sass & Sizzle backup.");
          }
        } catch (err) {
          alert("That backup file isn't valid.");
        }
      };
      reader.readAsText(file);
    }

    function resetEverything() {
      if (confirm("This will delete all saved recipes, pantry items, notes, ratings, and history. Are you sure?")) {
        localStorage.clear();
        location.reload();
      }
    }

    // ==========================================
    // 7. ONBOARDING MODAL CONTROLS
    // ==========================================
    let obModeSelected = 'healthy';
    function setObMode(mode) {
      obModeSelected = mode;
      const hBtn = document.getElementById('ob-mode-healthy');
      const cBtn = document.getElementById('ob-mode-craving');
      if (mode === 'healthy') {
        hBtn.className = 'py-2.5 rounded-xl text-xs font-bold border border-emerald-500 bg-emerald-500/20 text-emerald-300';
        cBtn.className = 'py-2.5 rounded-xl text-xs font-bold border border-white/10 bg-white/5';
      } else {
        cBtn.className = 'py-2.5 rounded-xl text-xs font-bold border border-orange-500 bg-orange-500/20 text-orange-300';
        hBtn.className = 'py-2.5 rounded-xl text-xs font-bold border border-white/10 bg-white/5';
      }
    }

    function finishOnboarding(skipped) {
      if (!skipped) {
        const name = document.getElementById('ob-name').value.trim();
        const diet = document.getElementById('ob-diet').value;
        if (name) state.profile.name = name;
        state.profile.diet = diet;
        state.mode = obModeSelected;
        setStored('sass-sizzle-profile', state.profile);
        setStored('sass-sizzle-mode', state.mode);
      }
      setStored('sass-sizzle-onboarded', true);
      document.getElementById('onboarding-modal').classList.add('hidden');
      render();
    }

    // ==========================================
    // 8. APP INITIALIZATION
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      const hasOnboarded = getStored('sass-sizzle-onboarded', false);
      if (!hasOnboarded) {
        document.getElementById('onboarding-modal').classList.remove('hidden');
      }
      render();
    });
  </script>
</body>
</html>
